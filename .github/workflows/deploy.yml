name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  lint:
    name: Линтер (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Установка зависимостей
        run: pip install flake8
      - name: Запуск линтера
        run: flake8 app.py tests/ --max-line-length=120 --ignore=E302,E305,W291,W292,W293,W391,E501

  test:
    name: Тесты (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Установка зависимостей
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Запуск тестов
        run: python -m pytest -v

  deploy:
    name: Деплой на продуктовый сервер
    runs-on: self-hosted
    needs: test
    steps:
      - name: Обновление кода на сервере
        run: |
          cd /opt/money-calculator
          git fetch origin
          git reset --hard origin/main
          source venv/bin/activate
          pip install -r requirements.txt
          echo "Деплой завершён успешно: $(date)"